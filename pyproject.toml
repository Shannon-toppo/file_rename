[project]
name = "file-rename"
version = "0.1.0"
description = "音声ファイルのタイトル推測・メタデータ書き込みスクリプト（mv2title のコンシューマ）"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.47",
    "mv2title",
    "pyside6>=6.7",
    "python-dotenv>=1.0",
    # 配布 exe には同梱しない（実行時に取得する。ytdlp_runtime 参照）。ここでの
    # 指定は開発時のフォールバックと、PyInstaller に依存を解析させるためのもの
    "yt-dlp>=2026.8.19",
    # YouTube の署名・n チャレンジを解く JS。これが無いと yt-dlp は実行のたびに
    # GitHub / npm を取りに行こうとし、既定では禁止されているので解けずに
    # 速度が落ちる。配布版は yt-dlp と対で実行時に取得する（install_ejs）ので、
    # ここも同梱用ではなく開発時のフォールバック
    "yt-dlp-ejs",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
# ハングしたテストを個別に打ち切る保険（CI の 6 時間ジョブ暴走の再発防止）。
# スイート全体が通常 1 分未満なので 1 テスト 60 秒は十分に余裕がある。
timeout = 60

[tool.uv]
# スクリプト集であってパッケージではない（ビルド・インストールしない）
package = false

[tool.uv.sources]
mv2title = { path = "../mv2title", editable = true }
